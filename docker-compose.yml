# PostgreSQL 16 with the pgvector extension pre-installed.
# Start:  docker compose up -d      Stop: docker compose down
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: urban_tandoor_db
    environment:
      POSTGRES_USER: tandoor
      POSTGRES_PASSWORD: tandoor
      POSTGRES_DB: urban_tandoor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
